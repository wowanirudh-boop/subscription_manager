[project]
name = "srt-phase0"
version = "0.1.0"
description = "Phase 0 feasibility pipeline for the Subscription Renewal Tracker (PRD v1.1, section 13)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "python-dateutil>=2.9",
  "google-api-python-client>=2.120",
  "google-auth>=2.28",
  "google-auth-oauthlib>=1.2",
  "pypdf>=4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
srt-phase0 = "srt_phase0.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
