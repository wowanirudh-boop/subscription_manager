[project]
name = "srt-backend"
version = "0.1.0"
description = "Subscription Renewal Tracker - Phase 1 backend (PRD v1.1 R1-R10)"
requires-python = ">=3.11"
dependencies = [
  "srt-phase0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "httpx>=0.27",
  "cryptography>=42",
  "pyjwt>=2.8",
  "google-auth>=2.28",
  "google-api-python-client>=2.120",
  "google-cloud-kms>=2.21; extra == 'gcp'",
  "psycopg[binary]>=3.1; extra == 'gcp'",
]

[project.optional-dependencies]
test = ["pytest>=8"]
gcp = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
